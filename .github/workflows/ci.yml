name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: node ${{ matrix.node }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: leptris/teptris
          path: teptris
          ref: v0.3.15
      - uses: mymindstorm/setup-emsdk@v16
        with:
          version: 3.1.74
      - name: Build (zero-warning gate)
        shell: bash
        run: |
          set -o pipefail
          ./build.sh 2>&1 | tee build.log
          # The wasm32 build is the only lane that compiles the engine with
          # 32-bit size_t/uintptr_t — warnings there are real portability
          # bugs (truncated 64-bit constants, UB shifts), not noise.
          ! grep -q "warning:" build.log || {
            echo "::error::emcc emitted warnings — wasm32 portability class"
            exit 1
          }
        env:
          ENGINESRC: ${{ github.workspace }}/teptris/src
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - run: npm install --no-audit --no-fund
      - run: npm test
      - name: Binding differential vs smol-toml
        run: node scripts/diff_smol.mjs test/corpus

  browser-smoke:
    name: browser smoke (headless chrome)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Checkout engine repository
        uses: actions/checkout@v7
        with:
          repository: leptris/teptris
          ref: v0.3.15
          path: teptris
      - uses: mymindstorm/setup-emsdk@v16
        with:
          version: 3.1.74
      - name: Build the module
        shell: bash
        run: bash build.sh
        env:
          ENGINESRC: ${{ github.workspace }}/teptris/src
      - name: Serve and drive headless chrome
        shell: bash
        run: |
          python3 -m http.server 8099 --bind 127.0.0.1 >/dev/null 2>&1 &
          SRV=$!
          sleep 1
          for _ in $(seq 1 20); do
            DOM=$(google-chrome --headless=new --disable-gpu --no-sandbox               --dump-dom http://127.0.0.1:8099/test/browser.html 2>/dev/null || true)
            case "$DOM" in
              *WASM-BROWSER-OK*) echo "$DOM" | grep -o "WASM-BROWSER-OK [0-9.]*"; kill $SRV; exit 0;;
              *WASM-BROWSER-FAIL*) echo "$DOM"; kill $SRV; exit 1;;
            esac
            sleep 1
          done
          echo "browser smoke: no verdict within timeout"; kill $SRV; exit 1

  # JS tier: teptris (wasm) vs the JS ecosystem's parsers — report
  # only, no gate (runner noise; the family referee limit applies).
  js-tier:
    name: js tier bench (report only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Checkout libteptris (the C core)
        uses: actions/checkout@v7
        with:
          repository: leptris/teptris
          path: teptris-engine
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      # Same pin as the matrix: an unpinned emsdk deprecates
      # -s WASM_BIGINT=1, and 3.1.74 still needs that flag (it
      # defaults OFF; i64 exports reject BigInt without it).
      - uses: mymindstorm/setup-emsdk@v16
        with:
          version: 3.1.74
      - run: npm install --no-audit --no-fund
      - name: Build (zero-warning gate)
        shell: bash
        run: |
          set -o pipefail
          ./build.sh 2>&1 | tee build.log
          # The wasm32 build is the only lane that compiles the engine with
          # 32-bit size_t/uintptr_t — warnings there are real portability
          # bugs (truncated 64-bit constants, UB shifts), not noise.
          ! grep -q "warning:" build.log || {
            echo "::error::emcc emitted warnings — wasm32 portability class"
            exit 1
          }
        env:
          ENGINESRC: ${{ github.workspace }}/teptris-engine/src
      - run: python3 teptris-engine/scripts/gen_bench_corpus.py corpus
      - run: node benchmark/js_tier.mjs corpus 20
